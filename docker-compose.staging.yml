services:
  litestream:
    extends:
      file: docker-compose.base.yml
      service: litestream
    volumes:
      - type: bind
        source: /data/staging
        target: /data
    environment:
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PATH=staging
      - SYNC_INTERVAL=60s
      - SNAPSHOT_RETENTION=72h
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
