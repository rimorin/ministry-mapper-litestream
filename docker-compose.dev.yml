services:
  litestream:
    extends:
      file: docker-compose.base.yml
      service: litestream
    volumes:
      - type: bind
        source: /data/dev
        target: /data
    environment:
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PATH=dev
      - SYNC_INTERVAL=300s
      - SNAPSHOT_RETENTION=24h
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
