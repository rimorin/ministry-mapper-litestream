services:
  litestream:
    image: 'litestream/litestream:0.5.18'
    user: root
    restart: unless-stopped
    # Litestream takes up to 30s to flush pending uploads on shutdown.
    stop_grace_period: 40s
    entrypoint: /bin/sh
    command:
      - -c
      - |
        cat > /tmp/litestream.yml << EOF
        access-key-id: $${R2_ACCESS_KEY_ID}
        secret-access-key: $${R2_SECRET_ACCESS_KEY}
        snapshot:
          interval: 24h
          retention: $${SNAPSHOT_RETENTION}
        dbs:
          - path: /data/data.db
            restore-if-db-not-exists: true
            replica:
              type: s3
              bucket: mm-pb-backups
              path: $${R2_PATH}
              endpoint: $${R2_ENDPOINT}
              region: auto
              sync-interval: $${SYNC_INTERVAL}
              auto-recover: true
        EOF
        exec litestream replicate -config /tmp/litestream.yml
