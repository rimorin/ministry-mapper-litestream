access-key-id: ${R2_ACCESS_KEY_ID}
secret-access-key: ${R2_SECRET_ACCESS_KEY}

dbs:
  - path: /data/data.db
    meta-path: /tmp/litestream-meta
    replica:
      type: s3
      bucket: ${R2_BUCKET}
      path: ${R2_PATH}
      endpoint: ${R2_ENDPOINT}
      region: auto
      sync-interval: ${SYNC_INTERVAL}
      auto-recover: true
