services:
  litestream:
    extends:
      file: docker-compose.base.yml
      service: litestream
    volumes:
      - type: bind
        source: /data/production
        target: /data
    environment:
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PATH=${R2_PATH}
      - SYNC_INTERVAL=${SYNC_INTERVAL}
