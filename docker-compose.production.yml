services:
  litestream:
    extends:
      file: docker-compose.base.yml
      service: litestream
    volumes:
      - type: bind
        source: /data/production
        target: /data
    environment:
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PATH=production
      - SYNC_INTERVAL=10s
      - SNAPSHOT_RETENTION=168h
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
